<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>荨麻疹科普视频</title>
<style>
  :root { --bg: #081620; --ink: #F4F7FA; --muted: #A9BCCD; --teal: #3FC1C9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "WenQuanYi Zen Hei", sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; }
  canvas { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; background: #0D2131; cursor: pointer; }
  .bar { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  button { background: rgba(255,255,255,0.08); color: var(--ink); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; height: 40px; min-width: 48px; font-size: 16px; cursor: pointer; }
  button.off { opacity: 0.45; text-decoration: line-through; }
  input[type=range] { flex: 1; accent-color: var(--teal); }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 92px; text-align: right; }
  #note { color: var(--muted); font-size: 14px; margin-top: 8px; }
  body.export main { padding: 0; max-width: none; }
  body.export canvas { width: 1920px; border-radius: 0; }
  body.export .bar, body.export #note { display: none; }
</style>
</head>
<body>
<main>
  <canvas id="stage" width="1920" height="1080"></canvas>
  <div class="bar">
    <button id="play" title="播放 / 暂停（空格）">▶</button>
    <input id="seek" type="range" min="0" step="0.01" value="0" aria-label="进度">
    <span id="time">0:00</span>
    <button id="cc" title="字幕开关">字幕</button>
  </div>
  <div id="note"></div>
</main>
<script src="src/narration.js"></script>
<script src="src/timeline.js"></script>
<script src="audio/manifest.js" onerror="void 0"></script>
<script src="src/draw.js"></script>
<script src="src/scenes.js"></script>
<script src="src/player.js"></script>
</body>
</html>
